<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">AWS VPC across two Availability Zones</title><desc id="desc">A regional VPC with public and private subnets in two availability zones, an internet gateway and NAT gateways.</desc>
<defs><style>text{font-family:Arial,sans-serif;fill:#e8eef5}.small{font-size:18px}.label{font-size:22px;font-weight:bold}.muted{fill:#a8b6c8}.box{stroke-width:2}.line{stroke:#9bb0c7;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs>
<rect width="1200" height="650" rx="24" fill="#0b1220"/>
<text x="48" y="55" font-size="30" font-weight="bold">AWS Region · Example VPC 10.0.0.0/16</text>
<rect x="40" y="90" width="1120" height="515" rx="22" fill="#111e30" stroke="#58a6ff" stroke-width="3"/>
<text x="65" y="128" class="small" fill="#79c0ff">Amazon VPC · Regional scope</text>
<rect x="75" y="155" width="500" height="410" rx="18" fill="#16263a" stroke="#8b949e" stroke-dasharray="9 7" stroke-width="2"/>
<rect x="625" y="155" width="500" height="410" rx="18" fill="#16263a" stroke="#8b949e" stroke-dasharray="9 7" stroke-width="2"/>
<text x="95" y="190" class="label">Availability Zone A</text><text x="645" y="190" class="label">Availability Zone B</text>
<rect x="100" y="220" width="450" height="135" rx="14" fill="#123b34" stroke="#3fb950" class="box"/>
<text x="125" y="255" class="label">Public subnet A · 10.0.1.0/24</text>
<rect x="125" y="275" width="175" height="55" rx="9" fill="#1f6f5c"/><text x="212" y="309" text-anchor="middle" class="small">NAT Gateway A</text>
<rect x="320" y="275" width="195" height="55" rx="9" fill="#1f6f5c"/><text x="417" y="309" text-anchor="middle" class="small">Public EC2 / ALB</text>
<rect x="100" y="385" width="450" height="145" rx="14" fill="#1b3154" stroke="#58a6ff" class="box"/>
<text x="125" y="420" class="label">Private subnet A · 10.0.11.0/24</text>
<rect x="160" y="445" width="330" height="58" rx="9" fill="#254d7a"/><text x="325" y="481" text-anchor="middle" class="small">Private application instances</text>
<rect x="650" y="220" width="450" height="135" rx="14" fill="#123b34" stroke="#3fb950" class="box"/>
<text x="675" y="255" class="label">Public subnet B · 10.0.2.0/24</text>
<rect x="675" y="275" width="175" height="55" rx="9" fill="#1f6f5c"/><text x="762" y="309" text-anchor="middle" class="small">NAT Gateway B</text>
<rect x="870" y="275" width="195" height="55" rx="9" fill="#1f6f5c"/><text x="967" y="309" text-anchor="middle" class="small">Public EC2 / ALB</text>
<rect x="650" y="385" width="450" height="145" rx="14" fill="#1b3154" stroke="#58a6ff" class="box"/>
<text x="675" y="420" class="label">Private subnet B · 10.0.12.0/24</text>
<rect x="710" y="445" width="330" height="58" rx="9" fill="#254d7a"/><text x="875" y="481" text-anchor="middle" class="small">Private application instances</text>
<rect x="490" y="20" width="220" height="52" rx="12" fill="#26364b" stroke="#d2a8ff" stroke-width="2"/><text x="600" y="53" text-anchor="middle" class="label">Internet Gateway</text>
<path d="M600 72 V145 H325 V220 M600 145 H875 V220" class="line"/>
<text x="600" y="630" text-anchor="middle" class="small muted">Illustrative architecture · routes and security rules must also be configured</text>
</svg>